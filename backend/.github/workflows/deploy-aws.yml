name: Deploy to Amazon EC2

on:
  push:
    branches:
      - vercel_aws_hackthon_backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/app"

      - name: Build and Run Docker Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            
            cd ~/app
            
            # Clean up old docker images and build cache to prevent disk full errors
            sudo docker builder prune -af
            sudo docker image prune -f
            
            # Build the Docker image (the Dockerfile is inside the backend subfolder)
            sudo docker build -t backend-app ./backend
            
            # Stop and remove the old container if it exists
            sudo docker stop backend-container || true
            sudo docker rm backend-container || true
            
            # Run the new container on port 10000
            sudo docker run -d -p 10000:10000 --env-file ./backend/.env --name backend-container backend-app
